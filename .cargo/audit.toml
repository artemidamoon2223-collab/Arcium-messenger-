# cargo-audit configuration for Arcium Messenger.
#
# Advisories below are in transitive dependencies we do not control (arti/Tor stack).
# The first two ignores were reviewed on 2026-06-07; each entry carries its own
# Added date. REVISIT AT NEXT SECURITY AUDIT.

[advisories]
ignore = [
    # RUSTSEC-2025-0009 — ring 0.16.x, AES panic under overflow-checked builds.
    # Provenance: ring 0.16.20 via arti-client → x509-signature → tor-rtcompat.
    # Impact: panic only when overflow-checks = true; our release profile has no such flag
    #   (Cargo.toml [profile.release]: opt-level=3, lto=true — no overflow-checks).
    # Fix: blocked on arti upgrading to ring >= 0.17.12. REVISIT AT SECURITY AUDIT.
    # Tracked: https://rustsec.org/advisories/RUSTSEC-2025-0009
    # Added: 2026-06-07
    "RUSTSEC-2025-0009",

    # RUSTSEC-2023-0071 — rsa 0.9.x, Marvin timing side-channel attack.
    # Provenance: rsa 0.9.10 via arti-client → tor-llcrypto (Tor stack only).
    # Impact: none — our message crypto uses XChaCha20-Poly1305 + X25519; rsa is
    #   never called on the message path. Only reachable through Tor's TLS layer.
    # Fix: no patched version available upstream as of 2026-06-07. REVISIT AT SECURITY AUDIT.
    # Tracked: https://rustsec.org/advisories/RUSTSEC-2023-0071
    # Added: 2026-06-07
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0387 — crypto-bigint < 0.7.6, timing variability in operations meant
    #   to be constant-time (subtraction, division, Montgomery multiplication, ...).
    # Provenance: crypto-bigint 0.5.5 via arti-client → tor-keymgr 0.21 → ssh-key 0.6.7
    #   → optional p256/p384/p521 0.13 → elliptic-curve 0.13.8. Cargo.lock lists optional
    #   dependencies even when no feature turns them on; this one never is.
    # Impact: none while the guard below passes — ssh-key is built with {std, alloc, ecdsa,
    #   rand_core} only, so elliptic-curve and crypto-bigint are not compiled for Linux or
    #   Android (Android Native Bridge CI job 124353595128 compiled neither).
    # Guard: .github/scripts/check_rustsec_2026_0387.py runs before cargo audit in
    #   arcium-ci.yml core-rust and fails if crypto-bigint enters the build graph for any
    #   checked target or feature mode, if a cargo command fails, or if Cargo.lock stops
    #   listing exactly crypto-bigint 0.5.5. This ignore is valid only together with it.
    # Fix: no patched 0.5.x; >= 0.7.6 needs ssh-key 0.7 (release candidates only) and an
    #   arti that adopts it. REMOVE this entry and the guard when crypto-bigint 0.5 leaves
    #   Cargo.lock (the guard then fails, by design). REVISIT AT SECURITY AUDIT.
    # Tracked: https://rustsec.org/advisories/RUSTSEC-2026-0387
    # Added: 2026-10-31 (Owner task C006)
    "RUSTSEC-2026-0387",
]
