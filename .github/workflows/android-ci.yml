name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ubuntu-latest ships with Android SDK including platforms;android-34
      # and build-tools;34.0.0. compileSdk=34 requires no extra installation.
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # Generate UniFFI Kotlin + native bridge inputs into the Gradle build dir
      # BEFORE compiling production Kotlin, so any future production reference to
      # uniffi.arcium_core.* resolves. Shared source of truth (no duplicated logic).
      - name: Generate UniFFI Kotlin + native bridge inputs
        uses: ./.github/actions/uniffi-android-bridge

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # assembleDebug neither compiles nor runs src/test, so without this step
      # the local JVM unit tests would be inert: broken test code would not even
      # fail the build. Runs before the APK so a logic regression is reported
      # before the longer packaging step.
      - name: Run JVM unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        id: build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      # Compiles and packages src/androidTest. This is a compile/package gate
      # only — it does NOT execute the instrumentation tests, which needs a
      # device or emulator. What it does catch is the instrumentation source
      # drifting away from the generated UniFFI API, which would otherwise stay
      # invisible until someone plugged in a phone.
      - name: Assemble instrumentation test APK
        working-directory: android
        run: ./gradlew assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Verify the instrumentation test APK was produced
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$APK"
          echo "instrumentation test APK: $APK ($(stat -c%s "$APK") bytes)"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 3

      - name: Post build error to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/build.log', 'utf8');
            const lines = log.split('\n');
            const errors = lines
              .filter(l => /^e:|error:|FAILURE:|Caused by:|Unresolved|> Task|SDK location/.test(l))
              .slice(0, 40)
              .join('\n');
            const tail = lines.slice(-30).join('\n');
            const body = `## 🔴 Android CI — Build Failure\n\n**Errors:**\n\`\`\`\n${errors || '(none matched)'}\n\`\`\`\n\n**Last 30 lines:**\n\`\`\`\n${tail}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: arcium-messenger-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # The second half of what a device run needs. Both this and the app APK
      # must be installed to execute TwoPeerMessagingInstrumentationTest; CI
      # itself never runs them.
      - name: Upload instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: arcium-messenger-androidtest
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
