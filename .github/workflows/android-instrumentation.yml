name: Android Instrumentation (emulator)

# Runs src/androidTest on an x86_64 emulator: the only place the JNA bridge,
# the packaged libarcium_core.so and the durable messaging lifecycle (S2-B2,
# including process death in DurableMessagingInstrumentationTest) execute on an
# Android runtime. The other Android workflows compile and package only.
#
# An emulator is not a phone: this says nothing about a physical device's
# storage or about power loss.
#
# NetworkMessagingInstrumentationTest talks to an independent peer on this
# host through a real relay (docs/NET-MESSAGING.md): both are started below
# and reached from the emulator at 10.0.2.2. Mixed environment: one emulator,
# one Linux process.

on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'android/**'
      - '.github/workflows/android-instrumentation.yml'
      - '.github/actions/uniffi-android-bridge/**'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'android/**'
      - '.github/workflows/android-instrumentation.yml'
      - '.github/actions/uniffi-android-bridge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Generate UniFFI Kotlin + native bridge inputs
        uses: ./.github/actions/uniffi-android-bridge

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build app and instrumentation APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Build the host relay and peer
        run: |
          cargo build -p relay --bin arcium-relay
          cargo test -p mobile-ffi --lib --no-run

      # The relay alerts if a stored envelope contains the plaintext canary
      # every test text carries; the check after the tests fails on that.
      # The peer's card reaches the tests as an instrumentation argument: the
      # out-of-band channel.
      - name: Start the relay and the host peer
        run: |
          set -euo pipefail
          mkdir -p net-e2e
          ./target/debug/arcium-relay --listen 0.0.0.0:7700 --log \
            --canary CANARY-PLAINTEXT-7f3a > net-e2e/relay.log 2>&1 &
          ARCIUM_PEER_RELAY=127.0.0.1:7700 \
          ARCIUM_PEER_DB="$PWD/net-e2e/peer.db" \
          ARCIUM_PEER_CARD_OUT="$PWD/net-e2e/peer.card" \
            cargo test -p mobile-ffi --lib -- --exact tests::net_peer::net_peer_bot --nocapture \
            > net-e2e/peer.log 2>&1 &
          for _ in $(seq 1 120); do
            [ -s net-e2e/peer.card ] && break
            sleep 1
          done
          test -s net-e2e/peer.card
          echo "PEER_CARD=$(cat net-e2e/peer.card)" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumentation tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: >-
            cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.relay=10.0.2.2:7700
            -Pandroid.testInstrumentationRunnerArguments.peerCard=${{ env.PEER_CARD }}

      # Gradle fails the step above on any failing test. This also refuses a
      # run where no tests executed or any was skipped, so an empty or ignored
      # suite cannot pass.
      - name: Require executed, unskipped tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(android/app/build/outputs/androidTest-results/connected/**/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no instrumentation result files" >&2
            exit 1
          fi
          python3 - "${files[@]}" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for f in sys.argv[1:]:
              for s in ET.parse(f).getroot().iter("testsuite"):
                  tests += int(s.get("tests", 0))
                  failures += int(s.get("failures", 0))
                  errors += int(s.get("errors", 0))
                  skipped += int(s.get("skipped", 0))
              for c in ET.parse(f).getroot().iter("testcase"):
                  print(f"  {c.get('classname')}.{c.get('name')}")
          print(f"INSTRUMENTATION tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if tests == 0 or failures or errors or skipped:
              sys.exit(1)
          EOF

      - name: Require relay traffic and no plaintext on the relay
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "--- relay requests (last 40) ---"
          grep -E '^relay: ' net-e2e/relay.log | tail -40 || true
          echo "--- peer (last 60 lines) ---"
          tail -60 net-e2e/peer.log || true
          sends=$(grep -c '^relay: SEND' net-e2e/relay.log || true)
          echo "RELAY SEND requests: ${sends}"
          if grep -q 'ALERT plaintext canary' net-e2e/relay.log; then
            echo "::error::plaintext reached the relay" >&2
            exit 1
          fi
          test "${sends}" -gt 0

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            net-e2e/*.log
          retention-days: 7
          if-no-files-found: ignore
