name: Android two-device messaging (two emulators)

# Two people messaging through the app's screens on two independent x86_64
# emulators — separate identities, encrypted databases and processes — over a
# development relay on this host (docs/NET-MESSAGING.md). The steps are in
# TwoDeviceMessengerTest; android/e2e/two_devices.py runs them on the right
# emulator, in order or side by side, and switches Bob's network off and on.
#
# Emulators are not phones: this says nothing about physical devices, their
# networks, power loss, or delivery while the app is closed.

on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'android/**'
      - '.github/workflows/android-two-device-e2e.yml'
      - '.github/actions/uniffi-android-bridge/**'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'android/**'
      - '.github/workflows/android-two-device-e2e.yml'
      - '.github/actions/uniffi-android-bridge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-devices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SYSTEM_IMAGE: "system-images;android-30;default;x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Generate UniFFI Kotlin + native bridge inputs
        uses: ./.github/actions/uniffi-android-bridge

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build app and instrumentation APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Build the relay
        run: cargo build -p relay --bin arcium-relay

      # The relay alerts if a stored envelope contains the plaintext canary
      # every test text carries; the check after the run fails on that.
      - name: Start the relay
        run: |
          mkdir -p e2e-out
          ./target/debug/arcium-relay --listen 0.0.0.0:7700 --log \
            --canary CANARY-PLAINTEXT-7f3a > e2e-out/relay.log 2>&1 &

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install the emulator and a system image
        run: |
          set -euo pipefail
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install emulator platform-tools "$SYSTEM_IMAGE" > /dev/null
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Boot Alice's and Bob's emulators
        run: |
          set -euo pipefail
          AVDM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          for who in alice bob; do
            echo no | "$AVDM" create avd --force -n "$who" -k "$SYSTEM_IMAGE" -d pixel_2
          done
          emulator -avd alice -port 5554 -no-window -gpu swiftshader_indirect -noaudio \
            -no-boot-anim -no-snapshot -memory 2048 > e2e-out/emulator-alice.log 2>&1 &
          emulator -avd bob -port 5556 -no-window -gpu swiftshader_indirect -noaudio \
            -no-boot-anim -no-snapshot -memory 2048 > e2e-out/emulator-bob.log 2>&1 &
          for serial in emulator-5554 emulator-5556; do
            timeout 600 adb -s "$serial" wait-for-device
            timeout 600 bash -c "until [ \"\$(adb -s $serial shell getprop sys.boot_completed | tr -d '\r')\" = 1 ]; do sleep 5; done"
            for s in window_animation_scale transition_animation_scale animator_duration_scale; do
              adb -s "$serial" shell settings put global "$s" 0
            done
            adb -s "$serial" install -r -t android/app/build/outputs/apk/debug/app-debug.apk
            adb -s "$serial" install -r -t android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            echo "$serial: booted, APKs installed"
          done

      - name: Run the two-device scenario
        run: |
          python3 android/e2e/two_devices.py --alice emulator-5554 --bob emulator-5556 \
            --relay 10.0.2.2:7700 --out e2e-out/steps

      # The driver fails on any failed, erroring, ignored or missing step.
      # This also refuses a run in which plaintext reached the relay or the
      # relay saw no traffic.
      - name: Require relay traffic and no plaintext on the relay
        if: always()
        run: |
          set -euo pipefail
          cat e2e-out/steps/summary.txt || true
          echo "--- relay requests (last 60) ---"
          grep -E '^relay: ' e2e-out/relay.log | tail -60 || true
          sends=$(grep -c '^relay: SEND' e2e-out/relay.log || true)
          echo "RELAY SEND requests: ${sends}"
          if grep -q 'ALERT plaintext canary' e2e-out/relay.log; then
            echo "::error::plaintext reached the relay" >&2
            exit 1
          fi
          test "${sends}" -gt 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-device-e2e
          path: e2e-out/
          retention-days: 7
          if-no-files-found: ignore
