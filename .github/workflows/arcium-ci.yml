name: Arcium CI

on:
  push:
  pull_request:
  workflow_dispatch:   # manual trigger from GitHub mobile (Actions tab)

# Least-privilege GITHUB_TOKEN: this workflow only builds, tests, lints, and
# audits — it never writes to repo contents. Without an explicit block the token
# inherits the repository default (possibly read-write-all), which any
# compromised step (cargo install, npm install, third-party action) would then
# hold. All jobs are read-only.
permissions:
  contents: read

jobs:
  # ── Job 0: every external action is pinned to a full commit SHA (F-5) ──
  # A tag or branch can be moved upstream to point at different code; a commit
  # SHA cannot. Scans every workflow and local action, so a new workflow is
  # checked without being listed anywhere.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Checker self-test
        run: python3 .github/scripts/check_action_pins.py --self-test
      - name: Action references are pinned
        run: python3 .github/scripts/check_action_pins.py

  # ── Job 1: Core Rust — root workspace only, no Arcium toolchain needed ──
  # arcium-psi borsh tests are NOT here: arcium-macros reads build/psi_intersect.arcis
  # at proc-macro expansion time. Those artifacts only exist after arcium build (Job 3).
  core-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      # --locked: the tracked Cargo.lock is the dependency graph (H-10). Cargo
      # fails instead of resolving anew if it is missing or out of date.
      - name: Core crates tests
        run: cargo test --workspace --locked
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --locked -- -D warnings
      # --version pins cargo-audit itself; --locked alone pins only the
      # dependencies of whichever version is newest on crates.io (F-5).
      - name: Cargo audit (known CVEs)
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --quiet
          cargo audit --version
          cargo audit --file Cargo.lock
      - name: Cargo.lock is tracked and was not rewritten
        run: |
          git ls-files --error-unmatch Cargo.lock
          git diff --exit-code -- Cargo.lock

  # ── Job 2: TS crypto — offline, verified ──
  ts-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install deps
        working-directory: arcium-psi/tests
        run: npm install
      - name: tsc + crypto tests
        working-directory: arcium-psi/tests
        run: |
          npx tsc --noEmit
          npx mocha --require ts-node/register 'src/crypto.test.ts'

  # ── Job 3: Arcium build — circuit, SBF program, IDL, borsh tests ──
  # Every step fails the job on a nonzero exit (F-11: this job used to swallow
  # `arcium build` failures and skip the borsh tests silently).
  arcium-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: arcium-hq/setup-arcium@e2e40ef15394b26e8f8f08617386bfb3efc3e83d # v0.10.4
        with:
          runner-arch-os: x86_64_linux
      - name: Diagnostic — toolchain versions
        run: |
          arcium --version || true
          anchor --version || true
          solana --version || true
      - name: arcium build
        working-directory: arcium-psi
        run: arcium build
      - name: Verify build artifacts
        working-directory: arcium-psi
        run: |
          for f in build/psi_intersect.arcis build/psi_intersect.arcis.ir \
                   target/deploy/arcium_psi.so target/idl/arcium_psi.json; do
            if [ ! -s "$f" ]; then
              echo "::error::arcium build produced no $f"
              exit 1
            fi
          done
          sha256sum build/psi_intersect.arcis.ir target/deploy/arcium_psi.so
          # CIRCUIT_HASH in the tests must be this build's circuit.
          built=$(sha256sum build/psi_intersect.arcis.ir | cut -d' ' -f1)
          recorded=$(grep -oE "CIRCUIT_HASH = '[0-9a-f]{64}'" tests/src/scenarios.test.ts | grep -oE '[0-9a-f]{64}')
          if [ "$built" != "$recorded" ]; then
            echo "::error::CIRCUIT_HASH ${recorded:-missing} is not the built circuit $built"
            exit 1
          fi
      # Runs the compiled psi_intersect circuit on chosen inputs (padding,
      # zero hashes, invalid counts) through Arcis's mock MPC evaluation.
      - name: psi_intersect circuit tests
        env:
          TEST_CIRCUIT: "1"
        run: |
          set -o pipefail
          cargo test --manifest-path arcium-psi/encrypted-ixs/Cargo.toml 2>&1 | tee circuit.log
          grep -qE '^test result: ok\. [1-9][0-9]* passed' circuit.log || {
            echo "::error::no circuit tests ran"
            exit 1
          }
        shell: bash
      - name: arcium-psi borsh tests (require the arcium artifacts)
        run: |
          set -o pipefail
          cargo test --manifest-path arcium-psi/programs/arcium-psi/Cargo.toml borsh_tests 2>&1 | tee borsh.log
          # A filter that matches nothing still exits 0; require that tests ran.
          grep -qE '^test result: ok\. [1-9][0-9]* passed' borsh.log || {
            echo "::error::no borsh tests ran"
            exit 1
          }
        shell: bash

  # ── Job 4: Arcium test — localnet integration (validator + Arx MPC nodes) ──
  # `arcium test` starts a local validator with the Arcium programs, this
  # program at genesis and the Arx nodes in Docker, then runs
  # tests/src/localnet (Anchor.toml [scripts] test). Its exit code is the
  # job's result; a run with no passing or with pending tests also fails.
  arcium-test:
    needs: arcium-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The diagnostics upload below must publish only sanitised files. These
      # check the scrubber and gate on synthetic keys and fixtures (T1-T7),
      # that this job's upload is gated, and that mutated gates are caught.
      - name: Diagnostics publication gate checks
        run: |
          python3 -B .github/scripts/scrub_localnet_diagnostics.py --self-test
          python3 -B .github/scripts/check_diagnostics_gate.py
          python3 -B .github/scripts/check_diagnostics_gate.py --self-test
      - uses: arcium-hq/setup-arcium@e2e40ef15394b26e8f8f08617386bfb3efc3e83d # v0.10.4
        with:
          runner-arch-os: x86_64_linux
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install test dependencies
        run: npm ci --prefix arcium-psi/tests
      - name: Local test wallet
        run: |
          test -f ~/.config/solana/id.json ||
            solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
      # Each real MPC scenario runs on its own fresh localnet: the Arx node
      # can lose a computation for a computation definition it has already
      # used (see tests/src/localnet/psi.localnet.ts). `arcium test` removes
      # the containers when it ends, and each run's generated files are
      # removed before the next, so each run's evidence (Arx node logs under
      # artifacts/, the validator log, the test's computation traces, Docker
      # container events) is copied to a raw directory right after it.
      #
      # Raw diagnostics are never uploaded: the repository is public. Only
      # scrub_localnet_diagnostics.py writes to the publication directory: it
      # checks a run's raw files against that run's generated keys and the
      # test wallet, and moves in only the files it checked and found clean,
      # with a manifest of their hashes. If that check cannot be completed,
      # nothing of that run is published. A failing scenario's diagnostics
      # are published the same way, and the step still fails.
      - name: arcium test, one fresh localnet per MPC scenario
        working-directory: arcium-psi
        env:
          LOCALNET_RAW_DIR: ${{ runner.temp }}/localnet-raw
          LOCALNET_STAGING_DIR: ${{ runner.temp }}/localnet-staging
          LOCALNET_PUBLISH_DIR: ${{ runner.temp }}/localnet-publish
        run: |
          set -o pipefail
          rm -rf "$LOCALNET_RAW_DIR" "$LOCALNET_STAGING_DIR" "$LOCALNET_PUBLISH_DIR"
          mkdir -p "$LOCALNET_RAW_DIR" "$LOCALNET_PUBLISH_DIR"
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          sudo prlimit --pid $$ --nofile=1048576:1048576
          run_scenario() {
            local scenario=$1 title=$2 raw="$LOCALNET_RAW_DIR/$1" status=0 events
            mkdir -p "$raw"
            docker events --filter type=container --format '{{json .}}' \
              > "$raw/docker-events.jsonl" 2>&1 &
            events=$!
            LOCALNET_MPC_SCENARIO=$scenario LOCALNET_DIAG_DIR=$raw \
              timeout 30m arcium test 2>&1 | tee "$raw/arcium-test.log" || status=$?
            kill "$events" 2>/dev/null || true
            wait "$events" 2>/dev/null || true
            cp .anchor/test-ledger/validator.log "$raw/" 2>/dev/null || true
            find artifacts -type f -name '*.log' -not -path 'artifacts/localnet/*' \
              -exec cp --parents {} "$raw/" \; 2>/dev/null || true
            find artifacts -type f > "$raw/artifacts-files.txt" 2>/dev/null || true
            python3 ../.github/scripts/scrub_localnet_diagnostics.py publish \
              "$raw" "$LOCALNET_PUBLISH_DIR/$scenario" "$LOCALNET_STAGING_DIR" \
              'artifacts/localnet/*' "$HOME/.config/solana/id.json"
            # A second `arcium test` reuses artifacts/localnet, and in 4 of 4
            # CI runs its MXE key was not available within the test's 10 s
            # wait. Removing what `arcium test` generated (git-ignored) makes
            # the next run start from the same state as the first.
            rm -rf artifacts .anchor/test-ledger
            if [ "$status" -ne 0 ]; then
              echo "::error::arcium test failed for MPC scenario $scenario"
              return 1
            fi
            if ! grep -qE '^ +[1-9][0-9]* passing' "$raw/arcium-test.log"; then
              echo "::error::arcium test reported no passing tests for $scenario"
              return 1
            fi
            if grep -qE '^ +[0-9]+ pending' "$raw/arcium-test.log"; then
              echo "::error::arcium test left tests pending (not executed) for $scenario"
              return 1
            fi
            if ! grep -qF "✔ $title" "$raw/arcium-test.log"; then
              echo "::error::MPC scenario $scenario did not run and pass: $title"
              return 1
            fi
          }
          run_scenario matches 'runs a PSI computation on the MPC cluster and returns the expected matches'
          run_scenario zero-hash 'compares real entries only, including a real zero hash'
          run_scenario invalid-count 'fails closed on an invalid count inside the circuit'
        shell: bash
      # Passes only if the publication directory holds nothing but sets the
      # scrubber wrote for this run, unchanged since. It must stay the last
      # step before the upload (check_diagnostics_gate.py checks that).
      - name: Diagnostics publication gate
        id: diagnostics_gate
        if: always()
        env:
          LOCALNET_PUBLISH_DIR: ${{ runner.temp }}/localnet-publish
        run: python3 .github/scripts/scrub_localnet_diagnostics.py verify "$LOCALNET_PUBLISH_DIR"
      - name: Upload localnet diagnostics
        if: always() && steps.diagnostics_gate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localnet-diagnostics-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/localnet-publish
          if-no-files-found: error
      - name: Localnet diagnostics summary
        if: always() && steps.diagnostics_gate.outcome == 'success'
        env:
          LOCALNET_PUBLISH_DIR: ${{ runner.temp }}/localnet-publish
        run: |
          for dir in "$LOCALNET_PUBLISH_DIR"/*/; do
            echo "######## $(basename "$dir")"
            python3 .github/scripts/summarize_localnet_diagnostics.py "$dir"
          done
