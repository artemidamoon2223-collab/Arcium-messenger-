name: Arcium CI

on:
  push:
  pull_request:
  workflow_dispatch:   # manual trigger from GitHub mobile (Actions tab)

# Least-privilege GITHUB_TOKEN: this workflow only builds, tests, lints, and
# audits — it never writes to repo contents. Without an explicit block the token
# inherits the repository default (possibly read-write-all), which any
# compromised step (cargo install, npm install, third-party action) would then
# hold. All four jobs are read-only.
permissions:
  contents: read

jobs:
  # ── Job 1: Core Rust — root workspace only, no Arcium toolchain needed ──
  # arcium-psi borsh tests are NOT here: arcium-macros reads build/psi_intersect.arcis
  # at proc-macro expansion time. Those artifacts only exist after arcium build (Job 3).
  core-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Core crates tests
        run: cargo test --workspace
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings
      - name: Cargo audit (known CVEs)
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

  # ── Job 2: TS crypto — offline, verified ──
  ts-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: arcium-psi/tests
        run: npm install
      - name: tsc + crypto tests
        working-directory: arcium-psi/tests
        run: |
          npx tsc --noEmit
          npx mocha --require ts-node/register 'src/crypto.test.ts'

  # ── Job 3: Arcium build — informational; may fail on toolchain/circuit issues ──
  # Outputs build_success=true/false so dependent steps can skip gracefully.
  arcium-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arcium-hq/setup-arcium@v0.10.4
        with:
          runner-arch-os: x86_64_linux
      - name: Diagnostic — toolchain versions
        run: |
          arcium --version || true
          anchor --version || true
          solana --version || true
      - name: arcium build
        id: arcium_build
        working-directory: arcium-psi
        run: |
          set -o pipefail
          if arcium build 2>&1 | tee /tmp/arcium_build.log; then
            echo "build_success=true" >> "$GITHUB_OUTPUT"
            echo "=== arcium build SUCCEEDED ==="
            sha256sum build/psi_intersect.arcis.ir || echo "IR file not found"
            find . -name "*.arcis.ir" | head -20
            ls -la build/ 2>/dev/null || true
          else
            echo "build_success=false" >> "$GITHUB_OUTPUT"
            first_error="$(grep -m1 -iE '^error' /tmp/arcium_build.log || echo 'no line matching ^error found in output')"
            echo "=== arcium build FAILED — see output above for details ==="
            echo "Hint: the first error above is the actual cause — do not assume a toolchain or circuit problem."
            echo "::error::arcium build failed: ${first_error}"
            {
              echo "### arcium build FAILED"
              echo ""
              echo "This job does not fail the workflow run (see F-11, docs/SECURITY-FINDINGS.md)."
              echo ""
              echo "First error line:"
              echo '```'
              echo "${first_error}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
      - name: arcium-psi borsh tests (requires arcium artifacts)
        if: steps.arcium_build.outputs.build_success == 'true'
        run: cargo test --manifest-path arcium-psi/programs/arcium-psi/Cargo.toml borsh_tests

  # ── Job 4: Arcium test — full integration, requires Job 3 ──
  arcium-test:
    needs: arcium-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arcium-hq/setup-arcium@v0.10.4
        with:
          runner-arch-os: x86_64_linux
      - name: arcium test (with open-files limit fix)
        working-directory: arcium-psi
        run: |
          set -o pipefail
          sudo prlimit --pid $$ --nofile=1048576:1048576
          if arcium test 2>&1 | tee /tmp/arcium_test.log; then
            echo "arcium test passed"
          else
            first_error="$(grep -m1 -iE '^error' /tmp/arcium_test.log || echo 'no line matching ^error found in output')"
            echo "arcium test did not pass — the real cause is the first error above. This job masks the failure: a green check here does NOT mean the tests ran."
            echo "::error::arcium test did not pass: ${first_error}"
            {
              echo "### arcium test did NOT pass"
              echo ""
              echo "**A green check on this job does NOT mean the tests ran.** This job intentionally does not fail the workflow (see F-11, docs/SECURITY-FINDINGS.md)."
              echo ""
              echo "First error line:"
              echo '```'
              echo "${first_error}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
