name: Karpathy Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  karpathy-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the review agent in default permission mode (this runner only)
        run: |
          # The repository's .claude/settings.json sets "defaultMode": "plan" for
          # interactive sessions. The action runs Claude Code in this checkout, so the
          # agent inherited plan mode, could not get its plan approved in CI, and ended
          # without reviewing anything. .claude/settings.local.json takes precedence over
          # .claude/settings.json; it is written here on the runner only and never
          # committed, so the repository-wide setting is unchanged.
          test ! -e .claude/settings.local.json
          printf '%s\n' '{"permissions":{"defaultMode":"default"}}' > .claude/settings.local.json

      - name: Run Karpathy Analysis
        id: claude_run
        # Pinned to the commit the `beta` tag pointed to when this workflow was repaired.
        uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-haiku-4-5-20251001
          max_turns: "40"
          timeout_minutes: "15"
          # The action allows file edits and git add/commit/push/rm by default. A review
          # must not change the repository, so those are denied (a deny rule wins over
          # the action's allow list). Any other tool that needs approval is refused in
          # non-interactive mode and shows up as a permission denial, which fails the gate.
          disallowed_tools: "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git rm:*)"
          direct_prompt: |
            You are reviewing this pull request. You must not change the repository:
            do not edit or create files, and do not run git add, commit, push or rm.
            Use only Read, Grep, Glob, LS, and Bash for `git diff`, `git log` and
            `git status`.

            Get the list of changed files and the PR diff:
              git diff --name-only origin/${{ github.base_ref }}...HEAD
              git diff origin/${{ github.base_ref }}...HEAD
            If the diff output is cut off, Read each remaining changed file.

            Review every changed file against Andrej Karpathy's 4 principles
            (https://github.com/forrestchang/andrej-karpathy-skills).

            1. **Think Before Coding** — every choice traces to a real requirement;
               no speculation, no silent assumptions.
            2. **Simplicity First** — minimum code that solves the stated problem;
               no speculative features, unnecessary abstractions, or impossible-case
               error handling.
            3. **Surgical Changes** — only the requested lines were touched;
               no "while I'm here" formatting, refactoring, or adjacent cleanup.
            4. **Goal-Driven** — the change is verifiable:
               tests added/updated, `cargo test` / `tsc --noEmit` stays green.

            Score each principle: ✅ Pass | ⚠️ Warning | ❌ Fail — with concrete evidence
            (file and line where possible). Finish with a 1-2 sentence overall verdict.
            Post the result as a comment on this PR.

            The LAST line of your final answer must be exactly one line of this form,
            with valid single-line JSON and nothing after it:
            KARPATHY_REVIEW_RESULT: {"review_completed": true, "files": ["<every changed path, exactly as git diff --name-only prints it>"], "principles": {"think_before_coding": {"verdict": "pass|warning|fail", "evidence": "<specific evidence>"}, "simplicity_first": {"verdict": "...", "evidence": "..."}, "surgical_changes": {"verdict": "...", "evidence": "..."}, "goal_driven": {"verdict": "...", "evidence": "..."}}, "summary": "<overall verdict>"}
            If you could not review every changed file, set "review_completed" to false.

      - name: List the PR's changed files
        if: always()
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/karpathy-changed-files.txt"
          echo "Changed files: $(wc -l < "$RUNNER_TEMP/karpathy-changed-files.txt")"

      - name: Fail unless the review was actually completed
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.claude_run.outcome }}
          EXECUTION_FILE: ${{ steps.claude_run.outputs.execution_file }}
          CHANGED_FILES: ${{ runner.temp }}/karpathy-changed-files.txt
        run: |
          # karpathy-review is a required check. It passes only when the execution record
          # itself shows a finished, unobstructed review of every changed file. The step
          # outcome, CLAUDE_SUCCESS (never visible to this step) or a PR comment alone
          # prove nothing: in PR #85 the agent ended in plan mode with outcome=success.
          # Passing this gate does not mean the reviewed code is correct or secure.
          python3 - <<'GATE'
          import json, os, sys

          def fail(reason):
              print(f"::error::Karpathy review not completed: {reason}. Do NOT add continue-on-error.")
              sys.exit(1)

          if os.environ.get("REVIEW_OUTCOME") != "success":
              fail(f"review step outcome={os.environ.get('REVIEW_OUTCOME') or 'unset'}")

          path = os.environ.get("EXECUTION_FILE") or ""
          if not path or not os.path.isfile(path):
              fail("no execution record")
          try:
              with open(path, encoding="utf-8") as f:
                  events = json.load(f)
          except (OSError, ValueError) as e:
              fail(f"execution record unreadable ({e})")
          if not isinstance(events, list) or not events:
              fail("execution record is empty or not a list")

          init = next((e for e in events if isinstance(e, dict) and e.get("type") == "system" and e.get("subtype") == "init"), None)
          if init is None:
              fail("no session start in execution record")
          if init.get("permissionMode") != "default":
              fail(f"agent ran in permission mode {init.get('permissionMode')!r}, expected 'default'")

          results = [e for e in events if isinstance(e, dict) and e.get("type") == "result"]
          if not results:
              fail("execution ended without a result (interrupted?)")
          result = results[-1]
          if result.get("subtype") != "success" or result.get("is_error") is not False:
              fail(f"execution ended as {result.get('subtype')!r}, is_error={result.get('is_error')!r}")
          if result.get("permission_denials"):
              names = ", ".join(sorted({d.get("tool_name", "?") for d in result["permission_denials"]}))
              fail(f"permission denied during review: {names}")

          # Pair each tool call with its result.
          calls, outputs = {}, {}
          for e in events:
              if not isinstance(e, dict):
                  continue
              for block in (e.get("message") or {}).get("content") or []:
                  if not isinstance(block, dict):
                      continue
                  if block.get("type") == "tool_use":
                      calls[block.get("id")] = block
                  elif block.get("type") == "tool_result":
                      outputs[block.get("tool_use_id")] = block
          if any(c.get("name") == "ExitPlanMode" for c in calls.values()):
              fail("agent produced a plan for approval instead of a review")

          def text_of(block):
              content = block.get("content")
              if isinstance(content, str):
                  return content
              if isinstance(content, list):
                  return "\n".join(p.get("text", "") for p in content if isinstance(p, dict))
              return ""

          diff_text, read_paths = [], set()
          for tool_id, call in calls.items():
              out = outputs.get(tool_id)
              if out is None or out.get("is_error"):
                  continue
              args = call.get("input") or {}
              if call.get("name") == "Bash" and "git diff" in str(args.get("command", "")):
                  diff_text.append(text_of(out))
              elif call.get("name") == "Read" and args.get("file_path"):
                  read_paths.add(os.path.normpath(str(args["file_path"])))
          diff_text = "\n".join(diff_text)

          with open(os.environ["CHANGED_FILES"], encoding="utf-8") as f:
              changed = [line.strip() for line in f if line.strip()]
          if not changed:
              fail("could not determine the PR's changed files")

          workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          unseen = []
          for name in changed:
              in_diff = f"diff --git a/{name} b/" in diff_text or f" b/{name}\n" in diff_text
              was_read = os.path.normpath(os.path.join(workspace, name)) in read_paths or name in read_paths
              if not (in_diff or was_read):
                  unseen.append(name)
          if unseen:
              fail(f"no diff or file read in the record for: {', '.join(unseen)}")

          final = [line for line in str(result.get("result", "")).splitlines() if line.strip()]
          marker = "KARPATHY_REVIEW_RESULT:"
          if not final or not final[-1].strip().startswith(marker):
              fail("final answer does not end with the KARPATHY_REVIEW_RESULT line")
          try:
              verdict = json.loads(final[-1].strip()[len(marker):])
          except ValueError as e:
              fail(f"KARPATHY_REVIEW_RESULT is not valid JSON ({e})")
          if not isinstance(verdict, dict) or verdict.get("review_completed") is not True:
              fail("review_completed is not true")
          if not isinstance(verdict.get("files"), list) or set(verdict["files"]) != set(changed):
              fail("reviewed file list does not match the PR's changed files")
          principles = verdict.get("principles")
          required = ("think_before_coding", "simplicity_first", "surgical_changes", "goal_driven")
          if not isinstance(principles, dict):
              fail("principles missing")
          for key in required:
              p = principles.get(key)
              if not isinstance(p, dict) or p.get("verdict") not in ("pass", "warning", "fail"):
                  fail(f"principle {key} has no pass/warning/fail verdict")
              if not isinstance(p.get("evidence"), str) or len(p["evidence"].strip()) < 20:
                  fail(f"principle {key} has no substantive evidence")
          if not isinstance(verdict.get("summary"), str) or len(verdict["summary"].strip()) < 20:
              fail("overall summary missing")

          print("Karpathy review completed:", ", ".join(f"{k}={principles[k]['verdict']}" for k in required))
          GATE
