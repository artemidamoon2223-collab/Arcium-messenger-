name: Karpathy Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  karpathy-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the completion gate
        run: python3 .github/scripts/test_karpathy_review_gate.py

      - name: Run the review agent in default permission mode (this runner only)
        run: |
          # The repository's .claude/settings.json sets "defaultMode": "plan" for
          # interactive sessions. The action runs Claude Code in this checkout, so the
          # agent inherited plan mode, could not get its plan approved in CI, and ended
          # without reviewing anything. .claude/settings.local.json takes precedence over
          # .claude/settings.json; it is written here on the runner only and never
          # committed, so the repository-wide setting is unchanged.
          test ! -e .claude/settings.local.json
          printf '%s\n' '{"permissions":{"defaultMode":"default"}}' > .claude/settings.local.json

      - name: Run Karpathy Analysis
        id: claude_run
        # Pinned to the commit the `beta` tag pointed to when this workflow was repaired.
        uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-haiku-4-5-20251001
          max_turns: "40"
          timeout_minutes: "15"
          # The action allows file edits and git add/commit/push/rm by default. A review
          # must not change the repository, so those are denied (a deny rule wins over
          # the action's allow list). Any other tool that needs approval is refused in
          # non-interactive mode and shows up as a permission denial, which fails the gate.
          disallowed_tools: "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git rm:*)"
          direct_prompt: |
            You are reviewing this pull request. You must not change the repository:
            do not edit or create files, and do not run git add, commit, push or rm.
            Use only Read, Grep, Glob, LS, and Bash for `git diff`, `git log` and
            `git status`.

            First, use the Read tool on
              .claude/skills/engineering-code-review/references/ci-karpathy-review.md
            and follow its methodology. The review is not complete without it.

            Get the list of changed files and the PR diff:
              git diff --name-only origin/${{ github.base_ref }}...HEAD
              git diff origin/${{ github.base_ref }}...HEAD
            If the diff output is cut off, Read each remaining changed file.

            Review every changed file against the four principles in that file:
            think_before_coding, simplicity_first, surgical_changes, goal_driven.
            Give each a verdict (pass, warning or fail) with concrete evidence
            (path:line). You cannot run tests: never report that tests pass or
            fail, and list claims you could not verify under "unverified".
            Post the review as a comment on this PR.

            End the review with this block, one field per line, with the marker
            lines on their own. Use "|" between each verdict and its evidence;
            list files separated by commas. The job and branch links may follow
            the block.
            KARPATHY_REVIEW_RESULT
            complete: yes
            files: <every changed path, exactly as git diff --name-only prints it>
            think_before_coding: <pass, warning or fail> | <specific evidence>
            simplicity_first: <pass, warning or fail> | <specific evidence>
            surgical_changes: <pass, warning or fail> | <specific evidence>
            goal_driven: <pass, warning or fail> | <specific evidence>
            unverified: <claims you could not verify, or none>
            summary: <overall verdict>
            KARPATHY_REVIEW_END
            If you could not review every changed file, write "complete: no".

      - name: List the PR's changed files
        if: always()
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/karpathy-changed-files.txt"
          echo "Changed files: $(wc -l < "$RUNNER_TEMP/karpathy-changed-files.txt")"

      - name: Fail unless the review was actually completed
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.claude_run.outcome }}
          EXECUTION_FILE: ${{ steps.claude_run.outputs.execution_file }}
          CHANGED_FILES: ${{ runner.temp }}/karpathy-changed-files.txt
        # karpathy-review is a required check. The gate decides it from the execution
        # record, never from the step outcome or a PR comment alone (in PR #85 the
        # agent ended in plan mode with outcome=success). Exit 1: the review was not
        # completed. Exit 2: it was completed and reported a FAIL finding, which
        # needs the owner's review. Passing does not mean the code is correct or
        # secure. See .github/scripts/karpathy_review_gate.py.
        run: python3 .github/scripts/karpathy_review_gate.py
