name: Monthly Backup to Releases

on:
  schedule:
    # Запускается каждый месяц (первого числа в 00:00 UTC)
    - cron: '0 0 1 * *'
  
  # Также можно запустить вручную через кнопку в интерфейсе
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN. This workflow creates a Release and uploads an
# asset, so it needs contents: write — but nothing more. Without an explicit
# block it would inherit the repository default (possibly read-write across all
# scopes: packages, actions, deployments, etc.).
permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      # No later step talks to git, so the write-scoped token is not left in
      # .git/config for the rest of the job.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Create ZIP archive
        run: |
          zip -r Arcium-messenger-backup-$(date +%Y-%m-%d).zip . -x ".git/*" ".github/*" "node_modules/*" ".env*"
      
      - name: Get backup filename
        id: filename
        run: |
          FILENAME=$(ls Arcium-messenger-backup-*.zip | head -n1)
          echo "backup_file=$FILENAME" >> $GITHUB_OUTPUT
      
      # The release is created as a draft with the ZIP attached and published
      # only after the ZIP is confirmed on it with its full size. If any command
      # fails, the job fails and at most an unpublished draft is left, never a
      # published backup release without its backup.
      - name: Publish release with the backup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: backup-${{ github.run_number }}-${{ github.run_id }}
          BACKUP_FILE: ${{ steps.filename.outputs.backup_file }}
        run: |
          set -euo pipefail
          test -s "$BACKUP_FILE"
          notes=$(printf '📦 Автоматический месячный бэкап проекта\n\n📅 Дата создания: %s\n\nСкачай ZIP-архив ниже и сохрани где нужно!\n' "$BACKUP_FILE")
          gh release create "$TAG" "$BACKUP_FILE" --draft --target "$GITHUB_SHA" \
            --title "Monthly Backup - $BACKUP_FILE" --notes "$notes"
          expected=$(printf '%s\t%s\tuploaded' "$BACKUP_FILE" "$(stat -c %s "$BACKUP_FILE")")
          assets=$(gh release view "$TAG" --json assets \
            --jq '.assets[] | [.name, (.size | tostring), .state] | @tsv')
          if ! grep -Fxq -- "$expected" <<< "$assets"; then
            echo "::error::$BACKUP_FILE is not on draft release $TAG; it stays unpublished"
            exit 1
          fi
          gh release edit "$TAG" --draft=false
