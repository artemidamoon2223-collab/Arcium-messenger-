[workspace]
resolver = "2"
members = [
    "crates/core-crypto",
    "crates/core-protocol",
    "crates/core-storage",
    "crates/core-transport",
    "crates/mobile-ffi",
    "crates/relay",
]
# A path dependency inside the workspace directory would otherwise become a
# member; the vendored crate is patched in below, not developed here.
exclude = ["vendor/tor-dirmgr"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hmac = { version = "0.13", features = ["zeroize"] }
hkdf = "0.13"
sha2 = { version = "0.11", features = ["zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
thiserror = "1"
indexmap = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true 

# RUSTSEC-2026-0459: libsqlite3-sys before 0.39 bundles a vulnerable SQLite.
# tor-dirmgr 0.21 (via arti-client) requires rusqlite 0.31, and every arti
# release so far caps it below 0.41, so the workspace could not resolve
# rusqlite 0.41 (libsqlite3-sys "links" allows one version). vendor/tor-dirmgr
# is the published 0.21.0 crate with only its rusqlite requirement raised to
# 0.41. Remove this patch and vendor/tor-dirmgr once an arti release accepts
# rusqlite >= 0.41. See vendor/README.md.
[patch.crates-io]
tor-dirmgr = { path = "vendor/tor-dirmgr" }
