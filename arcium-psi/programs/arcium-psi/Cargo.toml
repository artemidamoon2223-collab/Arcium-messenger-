[package]
name = "arcium-psi"
version = "1.0.0"
description = "Private Set Intersection for Arcium"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arcium_psi"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
arcium-anchor = "0.10.4"
# `arcium-anchor`'s macros expand to `::arcium_client::...` paths, so the program
# needs this direct dependency. Its default `transactions` feature is off-chain
# client code (RPC client, keypairs, `x25519-dalek` with `getrandom`), which
# does not build for SBF; `arcium-anchor` itself uses it with defaults off.
arcium-client = { version = "0.10.4", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(anchor_debug)', 'cfg(feature, values("anchor-debug"))'] }
