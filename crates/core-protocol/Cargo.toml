[package]
name = "core-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
core-crypto = { path = "../core-crypto" }
core-storage = { path = "../core-storage" }
zeroize.workspace = true
sha2.workspace = true

[dev-dependencies]
# The store with its test-only fault layer (`core-storage/src/fault.rs`), for
# `src/messaging/tests/store_faults.rs`. A dev-dependency's features count
# only in a Cargo call that builds this crate's tests (examples or benches);
# in such a call every crate built gets the store with the layer. What
# enables it where: `core-storage/tests/feature_graph.rs`.
core-storage = { path = "../core-storage", features = ["fault-injection"] }
tempfile = "3"
x25519-dalek.workspace = true
rand_core.workspace = true
