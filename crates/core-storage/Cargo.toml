[package]
name = "core-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
rand_core.workspace = true
zeroize.workspace = true
thiserror.workspace = true

[features]
# Test aid: scripted failures of store operations (`src/fault.rs`). Only a
# `[dev-dependencies]` entry may enable it. `tests/feature_graph.rs` checks
# that no normal or build dependency in the workspace does, and a build for
# Android with it on does not compile (`src/lib.rs`).
fault-injection = []

[dev-dependencies]
tempfile = "3"