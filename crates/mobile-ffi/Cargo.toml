[package]
name = "mobile-ffi"
version = "0.5.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
name = "arcium_core"

[dependencies]
uniffi = { version = "0.28", features = ["build"] }
core-crypto = { path = "../core-crypto" }
core-protocol = { path = "../core-protocol" }
core-storage = { path = "../core-storage" }
relay = { path = "../relay" }
# The Tor client (arti) for a relay with an onion address (docs/NET-MESSAGING.md,
# section 3a). It brings arti, and with it rsa, into the Android library
# (.cargo/audit.toml, RUSTSEC-2023-0071).
core-transport = { path = "../core-transport" }
sha2.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
rand_core.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3"
# Raw access to the store's SQLite file in the F-9 identity tests, to inject
# lock and corruption failures. The same version and features as core-storage.
rusqlite = { version = "0.41", features = ["bundled"] }
# To read the process's default rustls provider in a test: the version and
# features relay already uses, so no new crate.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
