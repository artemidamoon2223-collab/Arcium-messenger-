[package]
name = "relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# An untrusted store-and-forward relay for end-to-end encrypted envelopes, and
# the blocking client the app uses to reach it. Besides the standard library,
# only rusqlite (the relay's optional SQLite file), with the version and
# features core-storage already uses, so the Android build adds no crate.
[lib]
name = "relay"

[[bin]]
name = "arcium-relay"
path = "src/bin/arcium-relay.rs"

[dependencies]
thiserror.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
